name: WPF GUI

on:
  push:
    branches: [main, master, 'feature/**', 'fix/**', 'refactor/**', 'infra/**']
    paths:
      - 'gui/**'
      - '.github/workflows/wpf.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'gui/**'
      - '.github/workflows/wpf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Release builds refuse to bundle anything but the release CLI, so the C side
      # must exist before the WPF solution is built.
      - name: Build CLI
        run: |
          cmake --preset ninja-release
          cmake --build --preset ninja-release

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore gui/TokenProbe.Wpf.slnx -p:Platform="Any CPU"

      # msvc-dev-cmd exports Platform=x64, which is not a valid platform for the
      # WPF solution; pin the solution platform explicitly on every dotnet step.
      - name: Build
        run: dotnet build gui/TokenProbe.Wpf.slnx -c Release --no-restore -p:Platform="Any CPU"

      - name: Test
        run: dotnet test gui/TokenProbe.Core.Tests/TokenProbe.Core.Tests.csproj -c Release --no-build -p:Platform=AnyCPU --logger "console;verbosity=normal"
