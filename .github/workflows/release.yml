name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------------
  # 在各平台上构建并打包
  # -----------------------------------------------------------------------
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm dpkg-dev

      - name: Configure (release)
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release

      - name: Package
        working-directory: build/ninja-release
        run: cpack

      - name: Collect package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          # 缺少制品属于硬失败：不完整的发布绝不能悄悄发布出去。
          collected=0
          for f in build/ninja-release/TokenProbe-*; do
            [ -f "$f" ] && { cp "$f" dist/; collected=$((collected + 1)); }
          done
          shopt -u nullglob
          if [ "$collected" -eq 0 ]; then
            echo "ERROR: no package artifacts found under build/ninja-release/ (expected TokenProbe-*)" >&2
            ls -R build/ninja-release || true
            exit 1
          fi
          # 生成 SHA256 校验和；此步骤失败必须让任务失败。
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls dist/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # 源码包（通过 git archive 生成——排除 .git，遵循 .gitattributes）
  # -----------------------------------------------------------------------
  source-package:
    name: Source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create source archives
        run: |
          mkdir -p dist
          PREFIX="TokenProbe-${GITHUB_REF_NAME#v}"
          git archive --prefix="${PREFIX}/" --format=tar.gz \
            -o "dist/${PREFIX}.tar.gz" HEAD
          git archive --prefix="${PREFIX}/" --format=zip \
            -o "dist/${PREFIX}.zip" HEAD

      - name: Upload source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-source
          path: dist/*
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # 创建 GitHub Release
  # -----------------------------------------------------------------------
  release:
    name: Create Release
    needs: [package, source-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        id: release_notes
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          {
            echo "## ${TAG_NAME}"
            echo
            echo "### Install"
            echo
            echo "| Platform | Package |"
            echo "| --- | --- |"
            echo "| Linux   | \`.deb\` / \`.rpm\` / \`.tar.gz\` |"
            echo "| macOS   | \`.tar.gz\` |"
            echo "| Windows | \`.zip\` |"
            echo
            echo "### Changes"
            echo
          } > release-notes.md
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s' "$PREV_TAG..HEAD" >> release-notes.md
          else
            git log --pretty=format:'- %s' >> release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: false
